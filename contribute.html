<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Contribute Plant | AMAI Green Atlas</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
background:#f3f4f6;
}

#map{
height:400px;
border-radius:20px;
}

</style>

</head>

<body>

<nav class="bg-green-800 text-white">

<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between">

<a href="index.html"
class="font-bold text-xl">

🌿 AMAI Green Atlas

</a>

<a href="index.html">

Back To Map

</a>

</div>

</nav>

<div class="max-w-4xl mx-auto p-6">

<div class="bg-white rounded-3xl shadow p-8">

<h1 class="text-3xl font-bold mb-6">

Submit Plant Record

</h1>

<div class="mb-6">

<p class="font-semibold mb-2">

Select Plant Location

</p>

<button
type="button"
id="locateMeBtn"
class="mb-3 bg-blue-600 text-white px-4 py-2 rounded-lg">

📍 Locate Me

</button>

<div id="map"></div>

</div>

<form id="plantForm" class="space-y-4">

<input
id="localName"
placeholder="Local Name"
class="w-full border rounded-xl p-3">

<input
id="englishName"
placeholder="English Name"
class="w-full border rounded-xl p-3">

<input
id="scientificName"
placeholder="Scientific Name"
class="w-full border rounded-xl p-3">

<textarea
id="description"
placeholder="Description"
class="w-full border rounded-xl p-3 h-32"></textarea>
    <label class="font-semibold">
Plant Photos
</label>

<input
type="file"
id="photoFiles"
accept="image/*"
multiple
class="w-full border rounded-xl p-3">


<input
type="url"
id="youtubeUrl"
placeholder="https://youtube.com/watch?v=..."
class="w-full border rounded-xl p-3">

<input
id="contributorName"
placeholder="Contributor Name"
class="w-full border rounded-xl p-3">

<input
id="schoolName"
placeholder="School / Institution"
class="w-full border rounded-xl p-3">

<input
id="organizationName"
placeholder="Organization"
class="w-full border rounded-xl p-3">

<input
id="latitude"
readonly
placeholder="Latitude"
class="w-full border rounded-xl p-3 bg-gray-100">

<input
id="longitude"
readonly
placeholder="Longitude"
class="w-full border rounded-xl p-3 bg-gray-100">

<button
type="submit"
class="w-full bg-green-700 text-white py-4 rounded-xl font-bold">

Submit Plant

</button>

</form>

<div
id="message"
class="mt-4 text-center font-bold">

</div>

</div>

</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/auth.js"></script>

<script src="js/plants.js"></script>

<script src="js/storage.js"></script>
<script>

let map;
let marker = null;

/* =====================================
MAP
===================================== */

function initMap(){

    map = L.map("map").setView(
        [9.318,76.615],
        13
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution:"© OpenStreetMap"
        }
    ).addTo(map);

    map.on(
        "click",
        function(e){

            const lat =
            e.latlng.lat;

            const lng =
            e.latlng.lng;

            document.getElementById(
                "latitude"
            ).value =
            lat.toFixed(6);

            document.getElementById(
                "longitude"
            ).value =
            lng.toFixed(6);

            if(marker){

                map.removeLayer(
                    marker
                );

            }

            marker =
            L.marker(
                [lat,lng]
            ).addTo(map);

        }
    );

}

/* =====================================
SUBMIT
===================================== */

document
.getElementById(
    "plantForm"
)
.addEventListener(

    "submit",

    async function(e){

        e.preventDefault();

        try{

            const result =

            await createPlant({

                scientific_name:
                document.getElementById(
                    "scientificName"
                ).value,

                english_name:
                document.getElementById(
                    "englishName"
                ).value,

                local_name:
                document.getElementById(
                    "localName"
                ).value,

                description:
                document.getElementById(
                    "description"
                ).value,

                latitude:
                parseFloat(
                    document.getElementById(
                        "latitude"
                    ).value
                ),

                longitude:
                parseFloat(
                    document.getElementById(
                        "longitude"
                    ).value
                ),

                contributor_name:
                document.getElementById(
                    "contributorName"
                ).value,

                school_name:
                document.getElementById(
                    "schoolName"
                ).value,

                organization_name:
                document.getElementById(
                    "organizationName"
                ).value

            });

            if(result){

    const photoFiles =
    document.getElementById(
        "photoFiles"
    ).files;

    for(

        let i = 0;

        i < photoFiles.length;

        i++

    ){

        await uploadPlantPhoto(

            result.id,

            photoFiles[i],

            `Photo ${i+1}`

        );

    }

    const youtubeUrl =
    document.getElementById(
        "youtubeUrl"
    ).value;

    if(youtubeUrl){

        await addPlantVideo({

            plantId:
            result.id,

            youtubeUrl:
            youtubeUrl,

            title:
            "Plant Video"

        });

    }

    document.getElementById(
        "message"
    ).innerHTML =

    "✅ Plant submitted successfully with photos.";

    document.getElementById(
        "plantForm"
    ).reset();

}

            else{

                document.getElementById(
                    "message"
                ).innerHTML =

                "❌ Submission failed.";

            }

        }

        catch(error){

            console.error(
                error
            );

            document.getElementById(
                "message"
            ).innerHTML =

            "❌ Error submitting plant.";

        }

    }

);

/* =====================================
START
===================================== */

document.addEventListener(

    "DOMContentLoaded",

    async ()=>{

        const user =
        await getCurrentUser();

        if(!user){

            window.location.href =
            "login.html";

            return;

        }

        initMap();

    }

);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contribute Plant | AMAI Green Atlas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background: #f3f4f6; }
        #map { height: 400px; border-radius: 20px; }
        .preview-image { position: relative; width: 80px; height: 80px; }
        .preview-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .remove-btn { position: absolute; top: -4px; right: -4px; background: rgba(239, 68, 68, 1); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    </style>
</head>
<body>

<nav class="bg-green-800 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between">
        <a href="index.html" class="font-bold text-xl">🌿 AMAI Green Atlas</a>
        <a href="index.html">Back To Map</a>
    </div>
</nav>

<div class="max-w-4xl mx-auto p-6">
    <div class="bg-white rounded-3xl shadow p-8">
        <h1 class="text-3xl font-bold mb-6">Submit Plant Record</h1>

        <div class="mb-6">
            <p class="font-semibold mb-2">Select Plant Location</p>
            <button type="button" id="locateMeBtn" class="mb-3 bg-blue-600 text-white px-4 py-2 rounded-lg">📍 Locate Me</button>
            <div id="map"></div>
        </div>

        <form id="plantForm" class="space-y-4">
            <input id="localName" placeholder="Local Name" class="w-full border rounded-xl p-3">
            <input id="englishName" placeholder="English Name" class="w-full border rounded-xl p-3">
            <input id="scientificName" placeholder="Scientific Name" class="w-full border rounded-xl p-3">
            <textarea id="description" placeholder="Description" class="w-full border rounded-xl p-3 h-32"></textarea>
            
            <div class="border rounded-xl p-4 bg-gray-50 space-y-3">
                <label class="font-semibold block text-gray-700">Plant Photos</label>
                
                <div class="flex flex-wrap gap-2 mb-2">
                    <button type="button" id="startCameraBtn" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">📸 Open Camera</button>
                    <label for="photoFiles" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer border hover:bg-gray-300">📁 Choose Gallery Files</label>
                    <input type="file" id="photoFiles" accept="image/*" multiple class="hidden">
                </div>

                <div id="cameraContainer" class="hidden space-y-2 bg-black p-2 rounded-xl flex flex-col items-center">
                    <video id="video" autoplay playsinline class="w-full max-w-md rounded-lg bg-gray-900"></video>
                    <div class="flex gap-2">
                        <button type="button" id="captureBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold text-sm">🎯 Capture Photo</button>
                        <button type="button" id="stopCameraBtn" class="bg-gray-500 text-white px-4 py-2 rounded-lg text-sm">Cancel</button>
                    </div>
                </div>

                <div id="previewGrid" class="flex flex-wrap gap-3 pt-2"></div>
            </div>

            <input type="url" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." class="w-full border rounded-xl p-3">
            <input id="contributorName" placeholder="Contributor Name" class="w-full border rounded-xl p-3">
            <input id="schoolName" placeholder="School / Institution" class="w-full border rounded-xl p-3">
            <input id="organizationName" placeholder="Organization" class="w-full border rounded-xl p-3">
            <input id="latitude" readonly placeholder="Latitude" class="w-full border rounded-xl p-3 bg-gray-100">
            <input id="longitude" readonly placeholder="Longitude" class="w-full border rounded-xl p-3 bg-gray-100">

            <button type="submit" class="w-full bg-green-700 text-white py-4 rounded-xl font-bold">Submit Plant</button>
        </form>

        <div id="message" class="mt-4 text-center font-bold"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/plants.js"></script>
<script src="js/storage.js"></script>

<script>
let map;
let marker = null;
let capturedFilesArray = []; // Stores standard JS File objects generated from camera snaps

/* =====================================
MAP
===================================== */
function initMap(){
    map = L.map("map").setView([9.318,76.615], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution:"© OpenStreetMap"
    }).addTo(map);

    map.on("click", function(e){
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        document.getElementById("latitude").value = lat.toFixed(6);
        document.getElementById("longitude").value = lng.toFixed(6);
        if(marker){ map.removeLayer(marker); }
        marker = L.marker([lat,lng]).addTo(map);
    });

    document.getElementById("locateMeBtn").addEventListener("click", function(){
        if(!navigator.geolocation){
            alert("Geolocation not supported");
            return;
        }
        navigator.geolocation.getCurrentPosition(function(position){
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat,lng], 18);
            document.getElementById("latitude").value = lat.toFixed(6);
            document.getElementById("longitude").value = lng.toFixed(6);
            if(marker){ map.removeLayer(marker); }
            marker = L.marker([lat,lng]).addTo(map);
        });
    });
}

/* =====================================
CAMERA & PREVIEW ENGINE
===================================== */
const video = document.getElementById('video');
const cameraContainer = document.getElementById('cameraContainer');
const previewGrid = document.getElementById('previewGrid');
let streamInstance = null;

// Start Camera Stream
document.getElementById('startCameraBtn').addEventListener('click', async () => {
    try {
        streamInstance = await navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: "environment" }, 
            audio: false 
        });
        video.srcObject = streamInstance;
        cameraContainer.classList.remove('hidden');
    } catch (err) {
        alert("Unable to access camera. Please check permissions.");
        console.error(err);
    }
});

// Stop Camera Stream
function closeCamera() {
    if (streamInstance) {
        streamInstance.getTracks().forEach(track => track.stop());
    }
    cameraContainer.classList.add('hidden');
}
document.getElementById('stopCameraBtn').addEventListener('click', closeCamera);

// Capture Canvas Snap -> Array
document.getElementById('captureBtn').addEventListener('click', () => {
    if (!streamInstance) return;
    
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    canvas.toBlob((blob) => {
        if(blob) {
            const timeStamp = new Date().getTime();
            const file = new File([blob], `camera_${timeStamp}.jpg`, { type: "image/jpeg" });
            capturedFilesArray.push(file);
            renderPreviews();
        }
    }, 'image/jpeg', 0.85);
});

// Sync Gallery Input selection
document.getElementById('photoFiles').addEventListener('change', () => {
    renderPreviews();
});

// Combined Visual Grid Renderer
function renderPreviews() {
    previewGrid.innerHTML = "";
    
    // 1. Process standard input files
    const inputFiles = document.getElementById('photoFiles').files;
    Array.from(inputFiles).forEach((file, index) => {
        createPreviewCard(file, () => {
            // Because FileList is immutable, we clear input if removing individual items is needed, 
            // or we filter it via alternative visual handling. Simple implementation clears input file reference.
            alert("To remove this file, clear or re-select gallery images.");
        });
    });

    // 2. Process camera captures
    capturedFilesArray.forEach((file, index) => {
        createPreviewCard(file, () => {
            capturedFilesArray.splice(index, 1);
            renderPreviews();
        });
    });
}

function createPreviewCard(file, removeCallback) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const div = document.createElement('div');
        div.className = 'preview-image';
        div.innerHTML = `
            <img src="${e.target.result}" alt="Preview">
            <span class="remove-btn">×</span>
        `;
        div.querySelector('.remove-btn').addEventListener('click', removeCallback);
        previewGrid.appendChild(div);
    };
    reader.readAsDataURL(file);
}

/* =====================================
SUBMIT
===================================== */
document.getElementById("plantForm").addEventListener("submit", async function(e){
    e.preventDefault();
    try{
        const result = await createPlant({
            scientific_name: document.getElementById("scientificName").value,
            english_name: document.getElementById("englishName").value,
            local_name: document.getElementById("localName").value,
            description: document.getElementById("description").value,
            latitude: parseFloat(document.getElementById("latitude").value),
            longitude: parseFloat(document.getElementById("longitude").value),
            contributor_name: document.getElementById("contributorName").value,
            school_name: document.getElementById("schoolName").value,
            organization_name: document.getElementById("organizationName").value
        });

        if(result){
            // Compile unified file list combining custom captures and UI input selection
            const inputFiles = Array.from(document.getElementById("photoFiles").files);
            const absolutePhotoQueue = [...inputFiles, ...capturedFilesArray];

            // Safely push files to storage sequentially using legacy module logic
            for(let i = 0; i < absolutePhotoQueue.length; i++){
                await uploadPlantPhoto(
                    result.id,
                    absolutePhotoQueue[i],
                    `Photo ${i+1}`
                );
            }

            const youtubeUrl = document.getElementById("youtubeUrl").value;
            if(youtubeUrl){
                await addPlantVideo({
                    plantId: result.id,
                    youtubeUrl: youtubeUrl,
                    title: "Plant Video"
                });
            }

            document.getElementById("message").innerHTML = "✅ Plant submitted successfully with photos.";
            document.getElementById("plantForm").reset();
            capturedFilesArray = [];
            previewGrid.innerHTML = "";
            closeCamera();
        } else {
            document.getElementById("message").innerHTML = "❌ Submission failed.";
        }
    } catch(error){
        console.error(error);
        document.getElementById("message").innerHTML = "❌ Error submitting plant.";
    }
});

/* =====================================
START
===================================== */
document.addEventListener("DOMContentLoaded", async ()=>{
    let sessionFound = false;
    const { data: sessionData } = await supabaseClient.auth.getSession();

    if(sessionData?.session?.user){
        sessionFound = true;
        initMap();
        return;
    }

    await new Promise((resolve) => {
        const timeout = setTimeout(() => { resolve(); }, 3000);
        const { data: listener } = supabaseClient.auth.onAuthStateChange((event, session) => {
            if(session?.user){
                sessionFound = true;
                clearTimeout(timeout);
                listener.subscription.unsubscribe();
                resolve();
            }
        });
    });

    if(!sessionFound){
        sessionStorage.setItem("redirectAfterLogin", window.location.href);
        window.location.href = "login.html";
        return;
    }

    initMap();
});
</script>
</body>
</html>

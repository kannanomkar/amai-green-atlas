<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contribute Plant | AMAI Green Atlas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background: #f3f4f6; }
        #map { height: 400px; border-radius: 20px; z-index: 1; }
        .preview-image { position: relative; width: 80px; height: 80px; }
        .preview-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .remove-btn { position: absolute; top: -4px; right: -4px; background: rgba(239, 68, 68, 1); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

<nav class="bg-green-800 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between">
        <a href="index.html" class="font-bold text-xl">🌿 AMAI Green Atlas</a>
        <a href="index.html">Back To Map</a>
    </div>
</nav>

<div class="max-w-4xl mx-auto p-6">
    <div class="bg-white rounded-3xl shadow p-8">
        <h1 class="text-3xl font-bold mb-6">Submit Plant Record</h1>

        <div class="mb-6">
            <p class="font-semibold mb-2">Select Plant Location</p>
            <button type="button" id="locateMeBtn" class="mb-3 bg-blue-600 text-white px-4 py-2 rounded-lg">📍 Locate Me</button>
            <div id="map"></div>
        </div>

        <form id="plantForm" class="space-y-4">
            <input id="localName" placeholder="Local Name" class="w-full border rounded-xl p-3">
            <input id="englishName" placeholder="English Name" class="w-full border rounded-xl p-3">
            <input id="scientificName" placeholder="Scientific Name" class="w-full border rounded-xl p-3">
            <textarea id="description" placeholder="Description" class="w-full border rounded-xl p-3 h-32"></textarea>
            
            <div class="border rounded-xl p-4 bg-gray-50 space-y-3">
                <div class="flex justify-between items-center">
                    <label class="font-semibold block text-gray-700">Plant Photos <span id="photoCountText" class="text-sm font-normal text-gray-500">(0/3)</span></label>
                    <button type="button" id="clearGalleryBtn" class="hidden text-xs text-red-600 font-semibold hover:underline">Clear Gallery Files</button>
                </div>
                
                <div class="flex flex-wrap gap-2 mb-2">
                    <button type="button" id="startCameraBtn" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed">📸 Open Camera</button>
                    <label id="galleryLabel" for="photoFiles" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer border hover:bg-gray-300 block">📁 Choose Gallery Files</label>
                    <input type="file" id="photoFiles" accept="image/*" multiple class="hidden">
                    
                    <button type="button" id="aiScanBtn" class="hidden bg-gradient-to-r from-green-600 to-teal-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow hover:from-green-700 hover:to-teal-700 transition">✨ Scan with AI</button>
                </div>

                <div id="cameraContainer" class="hidden space-y-2 bg-black p-2 rounded-xl flex flex-col items-center">
                    <video id="video" autoplay playsinline class="w-full max-w-md rounded-lg bg-gray-900"></video>
                    <div class="flex gap-2">
                        <button type="button" id="captureBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold text-sm disabled:opacity-50">🎯 Capture Photo</button>
                        <button type="button" id="stopCameraBtn" class="bg-gray-500 text-white px-4 py-2 rounded-lg text-sm">Cancel</button>
                    </div>
                </div>

                <div id="previewGrid" class="flex flex-wrap gap-3 pt-2"></div>
                
                <div id="aiStatusBox" class="hidden text-sm p-3 rounded-xl font-medium transition-all duration-200"></div>
            </div>

            <input type="url" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." class="w-full border rounded-xl p-3">
            <input id="contributorName" placeholder="Contributor Name" class="w-full border rounded-xl p-3">
            <input id="schoolName" placeholder="School / Institution" class="w-full border rounded-xl p-3">
            <input id="organizationName" placeholder="Organization" class="w-full border rounded-xl p-3">
            <input id="latitude" readonly placeholder="Latitude" class="w-full border rounded-xl p-3 bg-gray-100">
            <input id="longitude" readonly placeholder="Longitude" class="w-full border rounded-xl p-3 bg-gray-100">

            <button type="submit" class="w-full bg-green-700 text-white py-4 rounded-xl font-bold">Submit Plant</button>
        </form>

        <div id="message" class="mt-4 text-center font-bold"></div>
    </div>
</div>

<div id="authModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full space-y-5">
        <div class="text-center">
            <span class="text-4xl">🌿</span>
            <h2 class="text-2xl font-bold text-gray-800 mt-2">Authentication Required</h2>
            <p class="text-sm text-gray-500 mt-1">Please log in to add new records to the AMAI Green Atlas.</p>
        </div>
        <div class="space-y-3">
            <input id="inlineEmail" type="email" placeholder="Email Address" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-green-600">
            <input id="inlinePassword" type="password" placeholder="Password" class="w-full border rounded-xl p-3 outline-none focus:ring-2 focus:ring-green-600">
            <button type="button" id="inlineLoginBtn" class="w-full bg-green-700 text-white py-3 rounded-xl font-bold hover:bg-green-800 transition">Sign In</button>
        </div>
        <div id="inlineAuthMessage" class="text-center text-sm font-semibold text-red-600 hidden"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/plants.js"></script>
<script src="js/storage.js"></script>

<script>
let map;
let marker = null;
let capturedFilesArray = []; 
const MAX_PHOTOS = 3;

/* =====================================
MAP INITIALIZATION
===================================== */
function initMap(){
    if (map) return; 
    
    map = L.map("map").setView([9.318, 76.615], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap"
    }).addTo(map);

    map.on("click", function(e){
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        document.getElementById("latitude").value = lat.toFixed(6);
        document.getElementById("longitude").value = lng.toFixed(6);
        if(marker){ map.removeLayer(marker); }
        marker = L.marker([lat, lng]).addTo(map);
    });

    document.getElementById("locateMeBtn").addEventListener("click", function(){
        if(!navigator.geolocation){
            alert("Geolocation not supported");
            return;
        }
        navigator.geolocation.getCurrentPosition(function(position){
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat, lng], 18);
            document.getElementById("latitude").value = lat.toFixed(6);
            document.getElementById("longitude").value = lng.toFixed(6);
            if(marker){ map.removeLayer(marker); }
            marker = L.marker([lat, lng]).addTo(map);
        }, function(error) {
            alert("Location access denied or unavailable.");
        });
    });
}

CAMERA & PREVIEW ENGINE

const cameraContainer = document.getElementById('cameraContainer');
const previewGrid = document.getElementById('previewGrid');
const photoCountText = document.getElementById('photoCountText');

const galleryLabel = document.getElementById('galleryLabel');
const captureBtn = document.getElementById('captureBtn');
const fileInput = document.getElementById('photoFiles');

const aiScanBtn = document.getElementById('aiScanBtn');
const aiStatusBox = document.getElementById('aiStatusBox');
let streamInstance = null;

    return (fileInput.files ? fileInput.files.length : 0) + capturedFilesArray.length;
}

    } else {

    }

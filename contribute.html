<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contribute Plant | AMAI Green Atlas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background: #f3f4f6; }
        #map { height: 400px; border-radius: 20px; z-index: 1; }
        .preview-image { position: relative; width: 80px; height: 80px; }
        .preview-image img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .remove-btn { position: absolute; top: -4px; right: -4px; background: rgba(239, 68, 68, 1); color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 11px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
    </style>
</head>
<body>

<nav class="bg-green-800 text-white">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between">
        <a href="index.html" class="font-bold text-xl">🌿 AMAI Green Atlas</a>
        <a href="index.html">Back To Map</a>
    </div>
</nav>

<div class="max-w-4xl mx-auto p-6">
    <div class="bg-white rounded-3xl shadow p-8">
        <h1 class="text-3xl font-bold mb-6">Submit Plant Record</h1>

        <div class="mb-6">
            <p class="font-semibold mb-2">Select Plant Location</p>
            <button type="button" id="locateMeBtn" class="mb-3 bg-blue-600 text-white px-4 py-2 rounded-lg">📍 Locate Me</button>
            <div id="map"></div>
        </div>

        <form id="plantForm" class="space-y-4">
            <input id="localName" placeholder="Local Name" class="w-full border rounded-xl p-3">
            <input id="englishName" placeholder="English Name" class="w-full border rounded-xl p-3">
            <input id="scientificName" placeholder="Scientific Name" class="w-full border rounded-xl p-3">
            <textarea id="description" placeholder="Description" class="w-full border rounded-xl p-3 h-32"></textarea>
            
            <div class="border rounded-xl p-4 bg-gray-50 space-y-3">
                <div class="flex justify-between items-center">
                    <label class="font-semibold block text-gray-700">Plant Photos <span id="photoCountText" class="text-sm font-normal text-gray-500">(0/3)</span></label>
                    <button type="button" id="clearGalleryBtn" class="hidden text-xs text-red-600 font-semibold hover:underline">Clear Gallery Files</button>
                </div>
                
                <div class="flex flex-wrap gap-2 mb-2">
                    <button type="button" id="startCameraBtn" class="bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-semibold disabled:opacity-50 disabled:cursor-not-allowed">📸 Open Camera</button>
                    <label id="galleryLabel" for="photoFiles" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold cursor-pointer border hover:bg-gray-300 block">📁 Choose Gallery Files</label>
                    <input type="file" id="photoFiles" accept="image/*" multiple class="hidden">
                    
                    <button type="button" id="aiScanBtn" class="hidden bg-gradient-to-r from-green-600 to-teal-600 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow hover:from-green-700 hover:to-teal-700 transition">✨ Scan with AI</button>
                </div>

                <div id="cameraContainer" class="hidden space-y-2 bg-black p-2 rounded-xl flex flex-col items-center">
                    <video id="video" autoplay playsinline class="w-full max-w-md rounded-lg bg-gray-900"></video>
                    <div class="flex gap-2">
                        <button type="button" id="captureBtn" class="bg-red-500 text-white px-4 py-2 rounded-lg font-bold text-sm disabled:opacity-50">🎯 Capture Photo</button>
                        <button type="button" id="stopCameraBtn" class="bg-gray-500 text-white px-4 py-2 rounded-lg text-sm">Cancel</button>
                    </div>
                </div>

                <div id="previewGrid" class="flex flex-wrap gap-3 pt-2"></div>
                
                <div id="aiStatusBox" class="hidden text-sm p-3 rounded-xl font-medium transition-all duration-200"></div>
            </div>

            <input type="url" id="youtubeUrl" placeholder="https://youtube.com/watch?v=..." class="w-full border rounded-xl p-3">
            <input id="contributorName" placeholder="Contributor Name" class="w-full border rounded-xl p-3">
            <input id="schoolName" placeholder="School / Institution" class="w-full border rounded-xl p-3">
            <input id="organizationName" placeholder="Organization" class="w-full border rounded-xl p-3">
            <input id="latitude" readonly placeholder="Latitude" class="w-full border rounded-xl p-3 bg-gray-100">
            <input id="longitude" readonly placeholder="Longitude" class="w-full border rounded-xl p-3 bg-gray-100">

            <button type="submit" class="w-full bg-green-700 text-white py-4 rounded-xl font-bold">Submit Plant</button>
        </form>

        <div id="message" class="mt-4 text-center font-bold"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/plants.js"></script>
<script src="js/storage.js"></script>

<script>
let map;
let marker = null;
let capturedFilesArray = []; 
const MAX_PHOTOS = 3;

/* =====================================
MAP INITIALIZATION
===================================== */
function initMap(){
    if (map) return; 
    
    map = L.map("map").setView([9.318, 76.615], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "© OpenStreetMap"
    }).addTo(map);

    map.on("click", function(e){
        const lat = e.latlng.lat;
        const lng = e.latlng.lng;
        document.getElementById("latitude").value = lat.toFixed(6);
        document.getElementById("longitude").value = lng.toFixed(6);
        if(marker){ map.removeLayer(marker); }
        marker = L.marker([lat, lng]).addTo(map);
    });

    document.getElementById("locateMeBtn").addEventListener("click", function(){
        if(!navigator.geolocation){
            alert("Geolocation not supported");
            return;
        }
        navigator.geolocation.getCurrentPosition(function(position){
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            map.setView([lat, lng], 18);
            document.getElementById("latitude").value = lat.toFixed(6);
            document.getElementById("longitude").value = lng.toFixed(6);
            if(marker){ map.removeLayer(marker); }
            marker = L.marker([lat, lng]).addTo(map);
        }, function(error) {
            alert("Location access denied or unavailable.");
        });
    });
}

/* =====================================
CAMERA & PREVIEW ENGINE
===================================== */
const video = document.getElementById('video');
const cameraContainer = document.getElementById('cameraContainer');
const previewGrid = document.getElementById('previewGrid');
const photoCountText = document.getElementById('photoCountText');
const startCameraBtn = document.getElementById('startCameraBtn');
const galleryLabel = document.getElementById('galleryLabel');
const captureBtn = document.getElementById('captureBtn');
const fileInput = document.getElementById('photoFiles');
const clearGalleryBtn = document.getElementById('clearGalleryBtn');
const aiScanBtn = document.getElementById('aiScanBtn');
const aiStatusBox = document.getElementById('aiStatusBox');
let streamInstance = null;

function getTotalPhotoCount() {
    return (fileInput.files ? fileInput.files.length : 0) + capturedFilesArray.length;
}

function updateActionUIState() {
    const total = getTotalPhotoCount();
    if (photoCountText) photoCountText.textContent = `(${total}/${MAX_PHOTOS})`;

    if (fileInput.files && fileInput.files.length > 0) {
        if (clearGalleryBtn) clearGalleryBtn.classList.remove('hidden');
    } else {
        if (clearGalleryBtn) clearGalleryBtn.classList.add('hidden');
    }

    if (total > 0) {
        if (aiScanBtn) aiScanBtn.classList.remove('hidden');
    } else {
        if (aiScanBtn) aiScanBtn.classList.add('hidden');
        if (aiStatusBox) aiStatusBox.classList.add('hidden');
    }

    if (total >= MAX_PHOTOS) {
        if (startCameraBtn) startCameraBtn.disabled = true;
        if (captureBtn) captureBtn.disabled = true;
        if (galleryLabel) galleryLabel.classList.add('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
        closeCamera();
    } else {
        if (startCameraBtn) startCameraBtn.disabled = false;
        if (captureBtn) captureBtn.disabled = false;
        if (galleryLabel) galleryLabel.classList.remove('opacity-50', 'cursor-not-allowed', 'pointer-events-none');
    }
}

if (startCameraBtn) {
    startCameraBtn.addEventListener('click', async () => {
        if (getTotalPhotoCount() >= MAX_PHOTOS) {
            alert(`You can only upload up to ${MAX_PHOTOS} photos.`);
            return;
        }
        try {
            streamInstance = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, 
                audio: false 
            });
            video.srcObject = streamInstance;
            cameraContainer.classList.remove('hidden');
        } catch (err) {
            alert("Unable to access camera. Please verify site permissions.");
            console.error(err);
        }
    });
}

function closeCamera() {
    if (streamInstance) {
        streamInstance.getTracks().forEach(track => track.stop());
        streamInstance = null;
    }
    if (cameraContainer) cameraContainer.classList.add('hidden');
}
const stopCameraBtn = document.getElementById('stopCameraBtn');
if (stopCameraBtn) stopCameraBtn.addEventListener('click', closeCamera);

if (captureBtn) {
    captureBtn.addEventListener('click', () => {
        if (!streamInstance) return;
        if (getTotalPhotoCount() >= MAX_PHOTOS) {
            alert(`Limit reached. You can only save up to ${MAX_PHOTOS} photos.`);
            closeCamera();
            return;
        }
        
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        canvas.toBlob((blob) => {
            if(blob) {
                const timeStamp = new Date().getTime();
                const file = new File([blob], `camera_${timeStamp}.jpg`, { type: "image/jpeg" });
                capturedFilesArray.push(file);
                renderPreviews();
            }
        }, 'image/jpeg', 0.85);
    });
}

if (fileInput) {
    fileInput.addEventListener('change', () => {
        const currentCameraCount = capturedFilesArray.length;
        const allowedRemaining = MAX_PHOTOS - currentCameraCount;

        if (fileInput.files.length > allowedRemaining) {
            alert(`You can only select up to ${allowedRemaining} more photo(s) from your gallery.`);
            fileInput.value = ""; 
        }
        renderPreviews();
    });
}

if (clearGalleryBtn) {
    clearGalleryBtn.addEventListener('click', () => {
        fileInput.value = "";
        renderPreviews();
    });
}

function renderPreviews() {
    if (!previewGrid) return;
    previewGrid.innerHTML = "";
    
    if (fileInput && fileInput.files) {
        Array.from(fileInput.files).forEach((file) => {
            createPreviewCard(file, () => {
                alert("To modify gallery selections, use the 'Clear Gallery Files' option.");
            });
        });
    }

    capturedFilesArray.forEach((file, index) => {
        createPreviewCard(file, () => {
            capturedFilesArray.splice(index, 1);
            renderPreviews();
        });
    });

    updateActionUIState();
}

function createPreviewCard(file, removeCallback) {
    const reader = new FileReader();
    reader.onload = (e) => {
        const div = document.createElement('div');
        div.className = 'preview-image';
        div.innerHTML = `
            <img src="${e.target.result}" alt="Preview">
            <span class="remove-btn">×</span>
        `;
        div.querySelector('.remove-btn').addEventListener('click', removeCallback);
        previewGrid.appendChild(div);
    };
    reader.readAsDataURL(file);
}

/* =====================================
PL@NTNET AI ENGINE
===================================== */
if (aiScanBtn) {
    aiScanBtn.addEventListener('click', async () => {
        let fileToScan = null;
        
        if (capturedFilesArray.length > 0) {
            fileToScan = capturedFilesArray[0];
        } else if (fileInput.files && fileInput.files.length > 0) {
            fileToScan = fileInput.files[0];
        }

        if (!fileToScan) {
            alert("Please capture or select an image first before using AI scanning features.");
            return;
        }

        aiStatusBox.className = "text-sm p-3 rounded-xl font-medium bg-blue-50 text-blue-800 block";
        aiStatusBox.textContent = "🧠 Running machine learning classification models... Please wait...";
        aiScanBtn.disabled = true;

        const formData = new FormData();
        formData.append('organs', 'auto');
        formData.append('images', fileToScan);

        const tokenSegment = atob("MmIxMWhzaUFnMm5La3IyYkRsTFJGYWVZZnU="); 
        const sanitizedKey = tokenSegment.replace("1h", "0h");
        const endpoints = `https://my.plantnet.org/v2/identify/all?api-key=${sanitizedKey}`;

        try {
            const syncResponse = await fetch(endpoints, {
                method: 'POST',
                body: formData
            });

            if (!syncResponse.ok) throw new Error("PlantNet API classification failure.");
            const report = await syncResponse.json();

            if (report.results && report.results.length > 0) {
                const targetMatch = report.results[0];
                const accuracy = (targetMatch.score * 100).toFixed(1);
                const standardScientific = targetMatch.species.scientificNameWithoutAuthor || targetMatch.species.scientificName || "";
                const fallbackEnglishArray = targetMatch.species.commonNames || [];
                const primaryEnglishName = fallbackEnglishArray.length > 0 ? fallbackEnglishArray[0] : "";

                document.getElementById("scientificName").value = standardScientific;
                document.getElementById("englishName").value = primaryEnglishName;

                aiStatusBox.className = "text-sm p-3 rounded-xl font-medium bg-green-50 text-green-800 block";
                aiStatusBox.textContent = `✅ AI Match Identified: "${standardScientific}" (${accuracy}% confidence ranking). Names filled automatically!`;
            } else {
                throw new Error("Low confidence structural matching matrix.");
            }
        } catch (error) {
            console.error("AI Operations Intercepted:", error);
            aiStatusBox.className = "text-sm p-3 rounded-xl font-medium bg-red-50 text-red-800 block";
            aiStatusBox.textContent = "❌ AI classification was unable to identify a precise match. Ensure plant details are close up and clear.";
        } finally {
            aiScanBtn.disabled = false;
        }
    });
}

/* =====================================
SUBMIT
===================================== */
document.getElementById("plantForm").addEventListener("submit", async function(e){
    e.preventDefault();
    try{
        const result = await createPlant({
            scientific_name: document.getElementById("scientificName").value,
            english_name: document.getElementById("englishName").value,
            local_name: document.getElementById("localName").value,
            description: document.getElementById("description").value,
            latitude: parseFloat(document.getElementById("latitude").value),
            longitude: parseFloat(document.getElementById("longitude").value),
            contributor_name: document.getElementById("contributorName").value,
            school_name: document.getElementById("schoolName").value,
            organization_name: document.getElementById("organizationName").value
        });

        if(result){
            const inputFiles = fileInput && fileInput.files ? Array.from(fileInput.files) : [];
            const absolutePhotoQueue = [...inputFiles, ...capturedFilesArray];

            for(let i = 0; i < absolutePhotoQueue.length; i++){
                await uploadPlantPhoto(
                    result.id,
                    absolutePhotoQueue[i],
                    `Photo ${i+1}`
                );
            }

            const youtubeUrl = document.getElementById("youtubeUrl").value;
            if(youtubeUrl){
                await addPlantVideo({
                    plantId: result.id,
                    youtubeUrl: youtubeUrl,
                    title: "Plant Video"
                });
            }

            document.getElementById("message").innerHTML = "✅ Plant submitted successfully with photos.";
            document.getElementById("plantForm").reset();
            capturedFilesArray = [];
            renderPreviews();
            closeCamera();
        } else {
            document.getElementById("message").innerHTML = "❌ Submission failed.";
        }
    } catch(error){
        console.error(error);
        document.getElementById("message").innerHTML = "❌ Error submitting plant.";
    }
});

/* =====================================
SAFE START/BOOT ENGINE
===================================== */
document.addEventListener("DOMContentLoaded", async () => {
    try {
        initMap();
    } catch(mapError) {
        console.error("Leaflet rendering fault caught:", mapError);
    }

    try {
        updateActionUIState();
    } catch(uiError) {
        console.error("UI alignment fault caught:", uiError);
    }
});
</script>
</body>
</html>
